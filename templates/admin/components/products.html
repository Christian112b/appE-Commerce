<!-- Card de Producto -->

<style>
    .card-section {
        padding: 10px;
        overflow: hidden;
        /* evita scrolls innecesarios */
    }

    .card-body {
        padding: 10px;
        overflow-x: auto;
        /* solo si la tabla se desborda horizontalmente */
    }

    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    body {
        overflow: hidden;
        /* opcional si el scroll general no se necesita */
    }

    .table td:last-child {
        white-space: nowrap;
    }

    .modal .form-label {
        font-weight: 500;
    }

    .modal .form-control,
    .modal .form-select {
        border-radius: 6px;
    }

    #productPreview {
        max-height: 100px;
        border-radius: 6px;
        margin-top: 5px;
        object-fit: cover;
    }
</style>

{% import 'macros/loadingMacro.html' as loadingComponent %}
{{ loadingComponent.loading_modal('loadingProducts', 'Cargando productos...') }}

{% include 'admin/components/editProductModal.html' %}




<div id="productosCard" class="card-section container-fluid" style="display: none; padding: 10px;">
    <div class="row">
        <!-- Tabla de productos -->
        <div class="col-md-9">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Listado de Productos</h5>
                    <button class="btn btn-primary" onclick="openProductForm()">Agregar Producto</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 700px; overflow-y: auto;">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Stock</th>
                                    <th>Activo</th>
                                    <th>Acciones
                                </tr>
                            </thead>
                            <tbody id="productTableBody">
                                <!-- Aquí se renderizan los productos dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <h6>Filtros</h6>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="filterCategory" class="form-label">Categoría</label>
                        <select id="filterCategoria" class="form-select mb-2">
                            <option value="">Todas</option>
                        </select>

                    </div>
                    <div class="mb-3">
                        <label for="filterActive" class="form-label">Estado</label>
                        <select id="filterActive" class="form-select">
                            <option value="">Todos</option>
                            <option value="1">Activos</option>
                            <option value="0">Inactivos</option>
                        </select>
                    </div>
                    <button class="btn btn-outline-primary w-100" onclick="applyProductFilters()">Aplicar
                        filtros</button>
                </div>
            </div>
        </div>
    </div>
</div>
