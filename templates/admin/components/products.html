<!-- Card de Producto -->

<style>
    .card-section {
        padding: 10px;
        overflow: hidden;
    }

    .card-body {
        padding: 10px;
        overflow-x: auto;
    }

    .table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    body {
        overflow: hidden;
    }

    .table td:last-child {
        white-space: nowrap;
    }

    .modal .form-label {
        font-weight: 500;
    }

    .modal .form-control,
    .modal .form-select {
        border-radius: 6px;
    }

    #productPreview {
        max-height: 100px;
        border-radius: 6px;
        margin-top: 5px;
        object-fit: cover;
    }

    /* Improved Table Styles */
    .admin-table {
        font-size: 0.875rem;
        margin-bottom: 0;
        border-collapse: separate;
        border-spacing: 0;
    }
    
    .admin-table thead th {
        background-color: #2c3e50;
        color: #fff;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
        padding: 12px 15px;
        white-space: nowrap;
        border-bottom: 2px solid #1a252f;
    }
    
    .admin-table tbody td {
        padding: 12px 15px;
        vertical-align: middle;
        border-color: #e9ecef;
        border-bottom: 1px solid #e9ecef;
    }
    
    .admin-table tbody tr:hover {
        background-color: #f8f9fa !important;
    }
    
    .product-name {
        font-weight: 500;
        color: #2c3e50;
        max-width: 200px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .product-desc {
        max-width: 250px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #6c757d;
        font-size: 0.8rem;
    }
    
    .badge-status {
        font-size: 0.7rem;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 500;
    }
    
    .badge-active {
        background-color: #d4edda;
        color: #155724;
    }
    
    .badge-inactive {
        background-color: #f8d7da;
        color: #721c24;
    }
    
    .price-badge {
        font-weight: 600;
        color: #198754;
        font-size: 0.9rem;
        white-space: nowrap;
    }
    
    .stock-badge {
        font-weight: 500;
        font-size: 0.85rem;
        white-space: nowrap;
    }
    
    .stock-low {
        color: #dc3545;
    }
    
    .stock-medium {
        color: #fd7e14;
    }
    
    .stock-high {
        color: #198754;
    }
    
    .btn-action {
        padding: 4px 8px;
        font-size: 0.8rem;
        margin: 0 2px;
        border-radius: 4px;
    }
</style>

{% import 'macros/loadingMacro.html' as loadingComponent %}
{{ loadingComponent.loading_modal('loadingProducts', 'Cargando productos...') }}

{% include 'admin/components/editProductModal.html' %}




<section id="section-productos" class="content-section">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-box me-2"></i>Listado de Productos</h5>
                        <button class="btn btn-primary" onclick="openProductForm()">
                            <i class="fas fa-plus me-1"></i> Agregar Producto
                        </button>
                    </div>
                    <div class="card-body" style="padding: 1.25rem;">
                        <!-- Filters -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <input type="text" class="filter-producto-nombre form-control" placeholder="Buscar por nombre...">
                                <input type="hidden" id="filterProductoStock" value="">
                            </div>
                            <div class="col-md-4">
                                <select id="filterProductoCategoria" class="form-select">
                                    <option value="">Todas las categorías</option>
                                    <!-- Categories will be loaded here -->
                                </select>
                            </div>
                            <div class="col-md-2">
                                <select id="filterProductoActivo" class="form-select">
                                    <option value="">Todos</option>
                                    <option value="1">Activos</option>
                                    <option value="0">Inactivos</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-secondary" id="applyProductoFiltersBtn" onclick="applyProductoFilters()">
                                    <i class="fas fa-filter me-1"></i> Filtrar
                                </button>
                            </div>
                        </div>

                        <!-- Products Table -->
                        <div class="table-responsive" style="max-height: calc(100vh - 450px); overflow-y: auto;">
                            <table class="table table-hover admin-table">
                                <thead style="position: sticky; top: 0; z-index: 10;">
                                    <tr>
                                        <th style="width: 60px;">ID</th>
                                        <th style="width: 180px;">Nombre</th>
                                        <th style="width: 220px;">Descripción</th>
                                        <th style="width: 140px;">Categoría</th>
                                        <th style="width: 100px;">Precio</th>
                                        <th style="width: 100px;">Stock</th>
                                        <th style="width: 90px;">Estado</th>
                                        <th style="width: 120px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody">
                                    <!-- Products will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
