<!-- Comentarios y Opiniones Section -->
<section class="comentarios" id="comentarios">
    <div class="container">
        <h2 class="section-title">Opiniones y Comentarios</h2>
        <p class="section-description">Comparte tu experiencia con Chocolates Costanzo</p>

        <!-- Formulario para agregar comentario -->
        <div class="comentario-form-container">
            <form id="comentarioForm" class="comentario-form">
                <div class="form-group">
                    <label for="nombreComentario">Tu Nombre</label>
                    <input type="text" id="nombreComentario" name="nombre" placeholder="Escribe tu nombre" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="textoComentario">Tu Comentario</label>
                    <textarea id="textoComentario" name="comentario" rows="4" placeholder="Escribe tu opinión sobre nuestros productos..." required maxlength="1000"></textarea>
                    <span class="char-count"><span id="charCount">0</span>/1000 caracteres</span>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Publicar Comentario
                </button>
            </form>
        </div>

        <!-- Lista de comentarios -->
        <div class="comentarios-list" id="comentariosList">
            <div class="loading-comments" id="loadingComments">
                <i class="fas fa-spinner fa-spin"></i> Cargando comentarios...
            </div>
        </div>
    </div>
</section>
