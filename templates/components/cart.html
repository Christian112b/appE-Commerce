<!-- Cart Sidebar -->

<link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3>Carrito de Compras</h3>
        <button class="close-cart" id="closeCart"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItems">
        <!-- Los items del carrito se cargarán dinámicamente -->

    </div>
    <div class="cart-footer">
        <div class="cart-summary">
            <div class="cart-summary-row">
                <span>Subtotal:</span>
                <span id="cartSubtotal">$0.00</span>
            </div>
            <div class="cart-summary-row">
                <span>IVA (16%):</span>
                <span id="cartIVA">$0.00</span>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
        </div>
        <button class="btn btn-primary btn-block" id="checkoutBtn">Proceder al Pago</button>
    </div>

    <!-- Modal de confirmación -->
    <div id="checkoutModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Resumen de tu pedido</h2>
            </div>

            <div class="modal-body" id="checkoutItems">
                <!-- Productos se insertan dinámicamente -->
            </div>

            <div class="modal-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="checkoutSubtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>IVA (16%):</span>
                    <span id="checkoutIVA">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="checkoutTotal">$0.00</span>
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="confirmCheckout()" class="btn-confirm">Confirmar compra</button>
                <button onclick="closeCheckoutModal()" class="btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>




</div>
