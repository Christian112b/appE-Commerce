<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Chocolates Costanzo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px;
        }
        
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #8B4513;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #8B4513;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background: #D2691E;
        }
        
        .credentials {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>🧪 Test de Login</h2>
        <p>Esta es una versión de prueba para verificar que los campos de texto funcionen correctamente.</p>
        
        <form id="testForm">
            <div class="form-group">
                <label for="testUsername">Usuario:</label>
                <input type="text" id="testUsername" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="testPassword">Contraseña:</label>
                <input type="password" id="testPassword" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit">Probar Login</button>
        </form>
        
        <div class="credentials">
            <strong>Credenciales de prueba:</strong><br>
            Usuario: admin<br>
            Contraseña: costanzo2024
        </div>
        
        <div id="result" style="margin-top: 15px; padding: 10px; border-radius: 5px; display: none;"></div>
    </div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('testUsername').value;
            const password = document.getElementById('testPassword').value;
            const resultDiv = document.getElementById('result');
            
            if (username === 'admin' && password === 'costanzo2024') {
                resultDiv.style.display = 'block';
                resultDiv.style.background = '#d4edda';
                resultDiv.style.color = '#155724';
                resultDiv.style.border = '1px solid #c3e6cb';
                resultDiv.innerHTML = '✅ ¡Login exitoso! Los campos funcionan correctamente.';
            } else {
                resultDiv.style.display = 'block';
                resultDiv.style.background = '#f8d7da';
                resultDiv.style.color = '#721c24';
                resultDiv.style.border = '1px solid #f5c6cb';
                resultDiv.innerHTML = '❌ Credenciales incorrectas. Intenta con: admin / costanzo2024';
            }
        });
        
        // Verificar que los inputs estén funcionando
        document.getElementById('testUsername').addEventListener('input', function() {
            console.log('Usuario:', this.value);
        });
        
        document.getElementById('testPassword').addEventListener('input', function() {
            console.log('Contraseña:', this.value);
        });
        
        console.log('🧪 Página de test cargada. Los campos deberían ser interactivos.');
    </script>
</body>
</html>
